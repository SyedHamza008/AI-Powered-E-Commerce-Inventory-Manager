version: '3.8'

services:
  # 1. Relational Database Service (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: inv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_admin
      POSTGRES_PASSWORD: secure_pg_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_admin -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Asynchronous Message Broker & Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: inv_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Flask Application Server (Gunicorn WSGI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inv_backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: super_production_secret_key_change_me_2026
      SQLALCHEMY_DATABASE_URI: postgresql://inventory_admin:secure_pg_password_2026@postgres:5432/inventory_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AI_PROVIDER: mock  # Or "gemini" with AI_API_KEY
      AI_API_KEY: mock-prod-key
      AI_MODEL_NAME: gemini-1.5-flash
      ALERT_EMAIL_RECIPIENT: alerts@company.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Celery Asynchronous Alert Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inv_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      FLASK_ENV: production
      SECRET_KEY: super_production_secret_key_change_me_2026
      SQLALCHEMY_DATABASE_URI: postgresql://inventory_admin:secure_pg_password_2026@postgres:5432/inventory_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALERT_EMAIL_RECIPIENT: alerts@company.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Production Nginx Web Server (React SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inv_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: